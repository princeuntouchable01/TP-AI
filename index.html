|<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TP AI | Tech Pro LUXE</title>

    <link rel="stylesheet" href="Style.css">
</head>

<body>

    <div class="app">

        <!-- Header -->
        <header class="header">

            <div class="brand">
                <div class="tp-logo">TP</div>

                <div>
                    <h1>TP</h1>
                    <span>Tech Pro Intelligence</span>
                </div>
            </div>

            <div class="status">
                <span class="status-dot"></span>
                <span>ONLINE</span>
            </div>

        </header>


        <!-- Chat Area -->
        <main class="chat" id="chat">

            <div class="welcome">

                <div class="welcome-logo">TP</div>

                <h2>Hello, I'm TP </h2>

                <p>
                    Your intelligent digital companion
                    built by TECH PRO LUXE.
                </p>

            </div>

        </main>


        <!-- Input Area -->
        <footer class="input-area">

            <input
                type="text"
                id="userInput"
                placeholder="Put your thoughts here..."
                autocomplete="off"
            >

            <button id="sendBtn">
                ➤
            </button>

        </footer>

    </div>


    <script src="Script.js"></script>

</body>
</html>
